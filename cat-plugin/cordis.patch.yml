# Loader patch shipped inside the dsh-client-ui-cat bundle (declared via
# `dsh.bundle` in package.json): inserts this package's plugin row so the
# Loader — and the client-modules half scanning for `dsh.client` — picks it
# up at boot. Rows reference packages by name, so Node module resolution
# finds the installed code in the profile's node_modules.
- insert:
    - id: ui-cat
      name: 'dsh-client-ui-cat'
